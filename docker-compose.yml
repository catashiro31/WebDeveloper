services:
  webapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docbooking_api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Authentication__AllowInsecureCookies=${AUTH_ALLOW_INSECURE_COOKIES:-false}
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Database=Docbooking;Username=postgres;Password=your_strong_password
      - ConnectionStrings__Redis=redis_cache:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      postgres_db:
        condition: service_started
      redis_cache:
        condition: service_healthy
    networks:
      - docbooking_network

  postgres_db:
    image: postgres:15-alpine
    container_name: docbooking_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_strong_password
      POSTGRES_DB: Docbooking
    ports:
      - "5432:5432" # Có thể đóng lại (xóa dòng này) nếu không muốn truy cập từ ngoài VPS
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - docbooking_network

  redis_cache:
    image: redis:7-alpine
    container_name: docbooking_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redisdata:/data
    networks:
      - docbooking_network

networks:
  docbooking_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
